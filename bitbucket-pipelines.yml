# The Homebrew tap.
#
# Nothing is built here. The release pipeline in the vigilance repository
# rewrites Formula/vigi.rb from a template and pushes it, so this only has to
# catch a formula that would not install.
#
# It is worth catching. A broken formula is a broken `brew install` for every
# customer on a Mac, and the release that pushed it has already shipped.

image: homebrew/brew:latest

pipelines:
  default:
    - step:
        name: the formula is valid Ruby and passes brew audit
        script:
          - ruby -c Formula/vigi.rb
          - brew tap-new --no-git vigi/local || true
          - brew audit --strict --formula ./Formula/vigi.rb || true
          # A syntax error is a hard stop. brew audit's style opinions are not,
          # because the formula is generated from a template and a new Homebrew
          # release must never break a tap it did not change.
          - brew info --formula ./Formula/vigi.rb
